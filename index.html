@media(max-width:520px){.hero{min-height:270px;background-position:right center;background-size:auto 92%;padding:18px}.intro{max-width:68%}h1{font-size:34px}p{font-size:14px}.content{padding:16px}}
</style></head><body><main>
<header class="hero"><div class="intro"><div class="tag">✦ EDIÇÃO ESPECIAL ✦</div><h1>OS<br>MISERÁVEIS</h1><b style="color:#fff">COM TUNG TUNG SAHUR</b><p>O Sahur te desafia! Teste seus conhecimentos sobre a obra de Victor Hugo.</p><div id="start"><button class="primary" onclick="start()">COMEÇAR QUIZ ▶</button></div></div></header>
<section id="game" class="content hide"><div class="meta"><span id="progress">PERGUNTA 1/5</span><span>PONTOS: <b id="points">0</b></span></div><h2 id="question"></h2><div class="answers" id="answers"></div><div id="feedback" class="feedback hide"></div><button id="next" class="primary hide" onclick="next()">PRÓXIMA →</button></section>
<section id="result" class="result hide"><div style="font-size:38px">🏆🪵</div><h2>DESAFIO CONCLUÍDO!</h2><div class="score" id="score">0/5</div><p id="message"></p><button class="primary" onclick="start()">JOGAR NOVAMENTE</button></section>
<footer>Quiz educativo · Os Miseráveis · Victor Hugo</footer></main>
<script>
const data=[
["Por que Fantine deixou Cosette com os Thénardier?",["Para poder trabalhar","Porque não gostava dela","Para viajar","Por ordem de Jean Valjean"],0,"Fantine precisava trabalhar para tentar sustentar a filha."],
["O que Madeleine fez em Montreuil-sur-Mer?",["Fundou uma grande fábrica","Construiu um castelo","Abriu uma escola","Virou soldado"],0,"A fábrica ajudou a cidade a prosperar."],
["Quem era Gavroche?",["Um policial","Filho dos Thénardier","Pai de Cosette","Dono de uma fábrica"],1,"Gavroche era filho dos Thénardier e vivia nas ruas."],
["Quem salvou a vida de Valjean quando uma carroça caiu sobre ele?",["Marius","Javert","Fauchelevent","Gavroche"],2,"Fauchelevent foi salvo por Valjean e depois retribuiu a ajuda."],
["Qual é uma das grandes mensagens da obra?",["A riqueza é tudo","A injustiça deve ser aceita","Solidariedade e transformação humana","O poder sempre vence"],2,"A obra destaca a desigualdade social, a compaixão e a transformação."]
];
let i=0,pts=0,locked=false;
function start(){i=0;pts=0;document.getElementById('start').classList.add('hide');document.getElementById('result').classList.add('hide');document.getElementById('game').classList.remove('hide');draw()}
function draw(){locked=false;let q=data[i];document.getElementById('progress').textContent=`PERGUNTA ${i+1}/5`;document.getElementById('points').textContent=pts;document.getElementById('question').textContent=q[0];let a=document.getElementById('answers');a.innerHTML='';q[1].forEach((v,j)=>{let b=document.createElement('button');b.textContent='ABCD'[j]+' · '+v;b.onclick=()=>answer(j);a.appendChild(b)});document.getElementById('feedback').classList.add('hide');document.getElementById('next').classList.add('hide')}
function answer(j){if(locked)return;locked=true;let q=data[i];[...document.getElementById('answers').children].forEach((b,k)=>{b.disabled=true;if(k===q[2])b.classList.add('good');else if(k===j)b.classList.add('bad')});if(j===q[2])pts++;document.getElementById('points').textContent=pts;let f=document.getElementById('feedback');f.textContent=(j===q[2]?'ACERTOU! 🔥 ':'QUASE! 😅 ')+q[3];f.classList.remove('hide');let n=document.getElementById('next');n.textContent=i===data.length-1?'VER RESULTADO':'PRÓXIMA →';n.classList.remove('hide')}
function next(){if(i<data.length-1){i++;draw()}else{document.getElementById('game').classList.add('hide');document.getElementById('result').classList.remove('hide');document.getElementById('score').textContent=pts+'/5';document.getElementById('message').textContent=pts===5?'PERFEITO! O Sahur ficou impressionado!':pts>=3?'Mandou bem! O Sahur aprova!':'Bora estudar mais um pouco e tentar de novo!'}}
</script></body></html>
